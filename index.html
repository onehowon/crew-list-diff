<!doctype html>
<html lang="ko" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewDiff 선원명부 변경대조</title>
<meta name="description" content="선원명부(IMO FAL Form 5) 최초본·수정본·수정 메일을 대조해 변경 근거와 확인 필요 항목을 보여 주는 PoC. 모든 데이터는 가상.">
<!-- Tabler 1.0.0 (MIT) · Tabler Icons 3.19.0 (MIT) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<!-- Leaflet 1.9.4 (BSD-2) · 지도 타일 © OpenStreetMap contributors © CARTO -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Pretendard 1.3.9 (OFL) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css?v=202610220142">
<link rel="icon" href="data:,">
<script type="module" src="app.js?v=202610220142"></script>
</head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<header class="sys-bar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><i class="ti ti-file-diff"></i></span>
    <span class="brand-name">CrewDiff</span>
    <span class="brand-sub">선원명부 변경대조</span>
    <span class="brand-tag" title="모든 인물·선박·번호·메일은 가상입니다. 신고를 전송하지 않습니다.">데모</span>
  </div>
  <span class="sys-spacer"></span>
  <button type="button" class="btn btn-sm sys-demo-btn" data-act="demo-start"><i class="ti ti-player-play" aria-hidden="true"></i><span class="lbl"> 시연 시작</span></button>
  <div class="sys-clock" id="sysClock" aria-live="off"></div>
  <button type="button" class="sys-bell" id="sysBell" data-act="bell" aria-label="새 메일"><i class="ti ti-bell" aria-hidden="true"></i><span class="sys-bell-n" id="sysBellN"></span></button>
  <div class="sys-user"><span class="sys-avatar" aria-hidden="true">데</span><span class="sys-user-t"><b>데모 담당자</b><span>○○해운대리점 부산지점</span></span></div>
</header>
<div class="sys-layout">
  <nav class="sys-rail" id="sysRail" aria-label="업무 메뉴"></nav>
  <div class="sys-center">
    <div class="vtabs" id="vtabs"></div>
    <main id="main" class="sys-main" tabindex="-1">
      <div id="demoBar"></div>
      <div id="vHead"></div>
      <section id="pg-ships" class="tab-panel" hidden></section>
      <section id="pg-ship" class="tab-panel" hidden></section>
      <section id="pg-work" class="tab-panel" hidden>
        <ol class="stepper" id="stepper" aria-label="처리 단계"></ol>
        <div id="pgHead"></div>
        <div id="stepBody"></div>
      </section>
      <section id="pg-inquiry" class="tab-panel" hidden></section>
      <section id="pg-mail" class="tab-panel" hidden></section>
      <section id="tab-eval" class="tab-panel" hidden></section>
      <section id="tab-scope" class="tab-panel" hidden></section>
      <footer class="app-footer">CrewDiff PoC · 모든 인물·선박·메일은 가상 · 신고 전송 없음</footer>
    </main>
  </div>
  <aside class="mailbox" id="mailbox" aria-label="메일함"></aside>
</div>
<div id="toast" class="arrive-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
