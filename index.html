<!doctype html>
<html lang="ko" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrewDiff 선원명부 변경대조</title>
<meta name="description" content="선원명부(IMO FAL Form 5) 최초본·수정본·수정 메일을 대조해 변경 근거와 확인 필요 항목을 보여 주는 PoC. 모든 데이터는 가상.">
<!-- Tabler 1.0.0 (MIT) · Tabler Icons 3.19.0 (MIT) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<!-- Pretendard 1.3.9 (OFL) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:,">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<header class="app-header">
  <div class="wrap app-header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i class="ti ti-file-diff"></i></span>
      <span class="brand-name">CrewDiff</span>
      <span class="brand-sub">선박대리점 입출항 담당자용 · 선원명부 변경대조</span>
      <span class="brand-tag">PoC</span>
    </div>
    <nav class="top-tabs" aria-label="화면 선택">
      <button type="button" class="top-tab" data-tab="replay"><i class="ti ti-player-play" aria-hidden="true"></i> 현장 재현</button>
      <button type="button" class="top-tab" data-tab="demo"><i class="ti ti-list-details" aria-hidden="true"></i> 단계별 상세</button>
      <button type="button" class="top-tab" data-tab="eval"><i class="ti ti-chart-bar" aria-hidden="true"></i> 평가 결과</button>
      <button type="button" class="top-tab" data-tab="scope"><i class="ti ti-scale" aria-hidden="true"></i> 범위·법령 근거</button>
    </nav>
  </div>
</header>
<div class="demo-band" role="note">
  <div class="wrap"><strong>데모</strong><span id="replayBadge" class="replay-badge" hidden>재현(가상 상황)</span> 모든 인물·선박·번호는 가상 · 신고를 전송하지 않음 · 출력은 담당자 확인용 준비 자료</div>
</div>
<main id="main" class="wrap main" tabindex="-1">
  <section id="tab-replay" class="tab-panel" hidden></section>
  <section id="tab-demo" class="tab-panel" hidden>
    <div id="voyage"></div>
    <ol class="stepper" id="stepper" aria-label="진행 단계"></ol>
    <div id="stepBody"></div>
  </section>
  <section id="tab-eval" class="tab-panel" hidden></section>
  <section id="tab-scope" class="tab-panel" hidden></section>
</main>
<footer class="wrap app-footer">
  CrewDiff PoC · 해운 AX 공모전 출품용 개념 검증 · 합성 데이터 · MIT License
</footer>
<div id="toast" class="arrive-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
